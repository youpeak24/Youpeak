# Gradle daemon: R8 minification of the release build runs inside this heap.
# With the current plugin set (Zego, Stripe, Ads, FFmpeg, Media3, Firebase...)
# 2.5 GB fails with "OutOfMemoryError: Java heap space" in
# :app:minifyReleaseWithR8; 4 GB builds (verified 2026-11-02). Do not lower it.
# ParallelGC has lower overhead than G1 for a short-lived build JVM.
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# The Kotlin compiler daemon is a second JVM; cap it so the two together stay
# well under physical RAM instead of each defaulting to the daemon's size.
kotlin.daemon.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m
# Parallel project builds multiply peak memory; 3 workers is the ceiling that
# fits in a 16 GB machine that is also running an IDE and a browser.
org.gradle.parallel=true
org.gradle.workers.max=3
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34
android.enableR8.fullMode=false
android.builtInKotlin=true
android.newDsl=false
kotlin.incremental=false
